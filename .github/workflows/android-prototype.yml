name: Android prototype APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/3d-anatomy-prototype

permissions:
  contents: write   # publishes the APK as a prerelease

concurrency:
  group: android-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned: "stable" moves every few weeks and each release raises the
          # minimum Gradle / AGP it accepts, which broke this build twice.
          # Bump this together with mobile/android (wrapper + settings.gradle).
          channel: stable
          flutter-version: 3.41.x
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Dart code (informational lints do not fail the build)
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit tests
        working-directory: mobile
        run: flutter test

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gympath-android-prototype
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # One fixed download link for the phone:
      # https://github.com/<owner>/<repo>/releases/download/prototype-latest/gympath-prototype.apk
      - name: Publish APK as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: prototype-latest
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk gympath-prototype.apk
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" gympath-prototype.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Gympath prototype (build #${{ github.run_number }})" \
            --notes "Automatic build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Signed with a temporary debug key: uninstall the previous build before installing this one."
