name: Web preview build

# Builds the app for the browser. The build is kept as a build artifact
# (gympath-web) and also committed to the web-build branch (generated files
# only), so it can be fetched with git and hosted as a private preview.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/3d-anatomy-prototype

permissions:
  contents: write   # updates the web-build branch

concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.x
          cache: true

      - name: Add the web platform files that are not in the repo
        working-directory: mobile
        run: flutter create --platforms web --project-name gympath .

      - name: Build for the web
        working-directory: mobile
        run: |
          flutter pub get
          # Everything (CanvasKit included) is served with the app: no CDN.
          flutter build web --release --no-web-resources-cdn --pwa-strategy none
          # The models also as glTF JSON (for hosts that serve no binary).
          for f in build/web/assets/assets/models/*.glb; do
            python3 ../tools/glb_to_gltf_json.py "$f" "${f%.glb}.json"
          done

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: gympath-web
          path: mobile/build/web
          retention-days: 14

      - name: Store the build on the web-build branch
        run: |
          cd mobile/build/web
          git init -q -b web-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" web-build
