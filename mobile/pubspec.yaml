name: gympath
description: Gympath - Fitness cable machine motion tracking app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_blue_plus: ^1.32.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  http: ^1.2.2
  crypto: ^3.0.5
  model_viewer_plus: ^1.10.0
  webview_flutter: ^4.11.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  wakelock_plus: ^1.2.8   # screen stays on during a tracker update

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/models/anatomy_male.glb
    - assets/models/anatomy_female.glb
  # Bundled so text needs no network (the web build would fetch it).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
